<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- power diode intake: steel chassis with a wound coil in a recessed bay -->
  <defs>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#857B69"/>
      <stop offset="0.35" stop-color="#ABA190"/>
      <stop offset="1" stop-color="#6C6455"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55606C"/>
      <stop offset="0.35" stop-color="#76828F"/>
      <stop offset="1" stop-color="#454E58"/>
    </linearGradient>
  </defs>
  <!-- silhouette outline -->
  <rect x="10" y="12" width="108" height="104" rx="9" fill="#000"/>
  <!-- front face (bottom plane) -->
  <path d="M16 92 H112 V106 Q112 110 108 110 H20 Q16 110 16 106 Z" fill="#212529"/>
  <!-- top plane / frame -->
  <path d="M20 18 H108 Q112 18 112 22 V92 H16 V22 Q16 18 20 18 Z" fill="#5A6572"/>
  <rect x="16" y="88" width="96" height="4" fill="#64707E"/>
  <!-- recessed bay -->
  <rect x="25" y="26" width="78" height="58" rx="2" fill="#33373C"/>
  <!-- coil windings -->
  <rect x="36" y="33" width="56" height="44" fill="url(#coil)"/>
  <g fill="#4A443A" opacity="0.85">
    <rect x="43" y="33" width="3" height="44"/>
    <rect x="52" y="33" width="3" height="44"/>
    <rect x="61" y="33" width="3" height="44"/>
    <rect x="70" y="33" width="3" height="44"/>
    <rect x="79" y="33" width="3" height="44"/>
  </g>
  <!-- end caps -->
  <rect x="28" y="30" width="9" height="50" rx="2" fill="url(#cap)"/>
  <rect x="91" y="30" width="9" height="50" rx="2" fill="url(#cap)"/>
</svg>
