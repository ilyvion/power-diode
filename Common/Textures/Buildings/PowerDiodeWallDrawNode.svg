<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- wall-mounted power diode intake: hatch set flush into the top of a wall, seen from directly
       above, with a wound coil lying in its opening -->
  <defs>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C6455"/>
      <stop offset="0.5" stop-color="#ABA190"/>
      <stop offset="1" stop-color="#6C6455"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454E58"/>
      <stop offset="0.5" stop-color="#76828F"/>
      <stop offset="1" stop-color="#454E58"/>
    </linearGradient>
  </defs>
  <!-- silhouette outline, doubling as the seam between hatch and wall -->
  <rect x="18" y="18" width="92" height="92" rx="5" fill="#000"/>
  <!-- hatch plate -->
  <rect x="21" y="21" width="86" height="86" rx="3" fill="#5A6572"/>
  <!-- mounting screws -->
  <g fill="#2E343B">
    <circle cx="28" cy="28" r="3.5"/>
    <circle cx="100" cy="28" r="3.5"/>
    <circle cx="28" cy="100" r="3.5"/>
    <circle cx="100" cy="100" r="3.5"/>
  </g>
  <!-- opening -->
  <rect x="32" y="34" width="64" height="60" rx="2" fill="#33373C"/>
  <!-- coil windings -->
  <rect x="44" y="42" width="40" height="44" fill="url(#coil)"/>
  <g fill="#4A443A" opacity="0.85">
    <rect x="50" y="42" width="3" height="44"/>
    <rect x="58" y="42" width="3" height="44"/>
    <rect x="66" y="42" width="3" height="44"/>
    <rect x="74" y="42" width="3" height="44"/>
  </g>
  <!-- end caps -->
  <rect x="36" y="39" width="9" height="50" rx="2" fill="url(#cap)"/>
  <rect x="83" y="39" width="9" height="50" rx="2" fill="url(#cap)"/>
</svg>
