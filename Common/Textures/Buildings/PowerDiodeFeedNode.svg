  <rect x="12" y="12" width="104" height="104" rx="5" fill="none" stroke="#000000" stroke-width="5"/>
  <rect x="52" y="4" width="24" height="12" rx="2" fill="#2b2b2b"/>
  <rect x="52" y="112" width="24" height="12" rx="2" fill="#1c1d1f"/>
  <rect x="4" y="52" width="12" height="24" rx="2" fill="#242527"/>
  <rect x="112" y="52" width="12" height="24" rx="2" fill="#242527"/>
  <circle cx="24" cy="24" r="3.5" fill="#2b2b2b"/>
  <circle cx="24" cy="104" r="3.5" fill="#1c1d1f"/>
