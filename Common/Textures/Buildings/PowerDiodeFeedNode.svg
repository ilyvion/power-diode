<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- power diode outlet: steel chassis with two SMD capacitors lying in a recessed bay -->
  <defs>
    <g id="capacitor">
      <!-- shadow cast onto the bay floor -->
      <rect x="2" y="20" width="70" height="4" fill="#26292D"/>
      <!-- ceramic body: top plane, front face -->
      <rect x="14" y="2" width="44" height="13" fill="#A09787"/>
      <rect x="14" y="15" width="44" height="5" fill="#6C6455"/>
      <!-- metal end caps: top plane, front face -->
      <rect x="0" y="0" width="15" height="15" rx="2" fill="#A7AFB8"/>
      <rect x="0" y="14" width="15" height="8" rx="2" fill="#6A727C"/>
      <rect x="0" y="14" width="15" height="3" fill="#6A727C"/>
      <rect x="57" y="0" width="15" height="15" rx="2" fill="#A7AFB8"/>
      <rect x="57" y="14" width="15" height="8" rx="2" fill="#6A727C"/>
      <rect x="57" y="14" width="15" height="3" fill="#6A727C"/>
    </g>
  </defs>
  <!-- silhouette outline -->
  <rect x="10" y="12" width="108" height="104" rx="9" fill="#000"/>
  <!-- front face (bottom plane) -->
  <path d="M16 92 H112 V106 Q112 110 108 110 H20 Q16 110 16 106 Z" fill="#212529"/>
  <!-- status lamp on the front face -->
  <rect x="94" y="97" width="9" height="6" rx="1" fill="#B89A4E"/>
  <!-- top plane / frame -->
  <path d="M20 18 H108 Q112 18 112 22 V92 H16 V22 Q16 18 20 18 Z" fill="#5A6572"/>
  <rect x="16" y="88" width="96" height="4" fill="#64707E"/>
  <!-- recessed bay -->
  <rect x="25" y="26" width="78" height="58" rx="2" fill="#33373C"/>
  <!-- capacitors -->
  <use href="#capacitor" x="28" y="31"/>
  <use href="#capacitor" x="28" y="57"/>
</svg>
