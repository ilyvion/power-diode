    <rect x="12" y="12" width="104" height="85" fill="#606c7a"/>
    <rect x="12" y="97" width="104" height="19" fill="#26282b"/>
    <!-- output coupling: a raised turbine-cap dome pushing power out of the building -->
    <circle cx="48" cy="56" r="22" fill="url(#dome)"/>
    <circle cx="48" cy="41" r="3" fill="#454d55"/>
    <circle cx="61" cy="48.5" r="3" fill="#454d55"/>
    <circle cx="61" cy="63.5" r="3" fill="#454d55"/>
    <circle cx="48" cy="71" r="3" fill="#454d55"/>
    <circle cx="35" cy="63.5" r="3" fill="#454d55"/>
    <circle cx="35" cy="48.5" r="3" fill="#454d55"/>
    <circle cx="48" cy="56" r="7" fill="#3a4048"/>
    <!-- elevated tan panel: bottom shadow edge only, matching the draw node's raised panel -->
    <rect x="78" y="30" width="26" height="58" fill="#9f9585"/>
    <g clip-path="url(#ventPanel)">
      <rect x="78" y="83" width="26" height="5" fill="#7d7566"/>
