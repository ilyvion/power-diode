<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="body"><rect x="12" y="12" width="104" height="104" rx="5"/></clipPath>
    <radialGradient id="dome" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0%" stop-color="#9aa6b2"/>
      <stop offset="55%" stop-color="#78838f"/>
      <stop offset="100%" stop-color="#4c545d"/>
    </radialGradient>
    <clipPath id="ventPanel"><rect x="78" y="30" width="26" height="58"/></clipPath>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="5" fill="#000000"/>
